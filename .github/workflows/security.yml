name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly sweep so newly disclosed advisories are caught even with no commits.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - run: npm ci
      # Fails the build on any high/critical advisory. Moderate findings are
      # reported but do not block (see SECURITY.md for the accepted exception).
      - name: npm audit (high+)
        run: npm run audit:ci
      - name: npm audit (full report, non-blocking)
        if: always()
        run: npm audit || true

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for GitHub Organization accounts.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
